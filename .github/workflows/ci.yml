name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator and trace recorder
        run: |
          g++ -O2 -std=c++17 -Wall -o dramsim dramsim.cpp
          g++ -O2 -std=c++17 -Wall -o record_traces record_traces.cpp
      - name: Run hand-checked self-tests
        run: ./dramsim --selftest
      - name: Check Python scripts compile
        run: python3 -m py_compile gen_traces.py run_experiments.py make_plots.py ramulator_project/*.py
